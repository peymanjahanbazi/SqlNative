name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write
    packages: write

jobs:
    build-pack-push:
        runs-on: ubuntu-latest
        # This MUST match the "Environment" in your nuget.org trusted publishing policy
        environment: production

        # These permissions are required for OIDC
        permissions:
            contents: write
            id-token: write # Enable GitHub OIDC token issuance
            actions: read # Sometimes required for NuGet/login to read workflow data

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      6.0.x
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build -c Release --no-restore

            - name: Test
              run: dotnet test -c Release --no-build --logger trx

            - name: Pack
              run: dotnet pack -c Release --no-build -o artifacts -p:ContinuousIntegrationBuild=true

            - name: NuGet login (OIDC → temporary API key)
              id: nuget-login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Push to nuget.org
              run: |
                  for pkg in artifacts/*.nupkg; do
                    dotnet nuget push "$pkg" \
                      --source https://api.nuget.org/v3/index.json \
                      --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
                      --skip-duplicate
                  done

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      artifacts/*.nupkg
                      artifacts/*.snupkg
